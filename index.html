<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardik Bhatt – Games</title>
<style>
  :root { --ink: #1b1b2f; --muted: #555a78; --accent: #5b6ee1; --bg: #f6f7fc; --card: #fff; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .muted { color: var(--muted); margin: 0 0 28px; }
  .game { display: flex; gap: 16px; align-items: center; background: var(--card);
          border: 1px solid #dde1ee; border-radius: 14px; padding: 16px; }
  .game img { width: 72px; height: 72px; border-radius: 16px; }
  .game h2 { font-size: 20px; margin: 0 0 4px; }
  .game p { margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Hardik Bhatt – Games</h1>
  <p class="muted">Learning games for children. Contact: hardikgamedev8@gmail.com</p>

  <div class="game">
    <img src="alien-alphabet-defense/icon.png" alt="Alien Alphabet Defense icon">
    <div>
      <h2>Alien Alphabet Defense</h2>
      <p>Tap letters to stop silly aliens and learn ABCs, 123s and first words.</p>
      <p><a href="alien-alphabet-defense/privacy-policy.html">Privacy policy</a></p>
    </div>
  </div>
</main>
</body>
</html>
